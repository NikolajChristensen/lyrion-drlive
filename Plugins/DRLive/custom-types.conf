# DRLive custom content type.
# Fields: <type> <suffixes> <mimetypes> <slimtype>
# The "drlive:" suffix lets Slim::Music::Info map a drlive:// URL to this type,
# and the "audio" slimtype makes it a playable song (not a playlist).
drlive	drlive:	audio/x-drlive	audio

# drvod:// (on-demand shows, e.g. TVA's latest episode) reuses the SAME "drlive"
# type as the live channels above: the underlying mechanism is identical - a
# plain remote URL handed to ffmpeg - so it reuses the drlive-*-*-* profiles in
# custom-convert.conf rather than duplicating them under a second type. This
# line only teaches LMS that a "drvod:" URL is playable audio; VODProtocolHandler
# separately declares getFormatForURL => 'drlive' for the actual transcode.
drlive	drvod:	audio/x-drvod	audio
