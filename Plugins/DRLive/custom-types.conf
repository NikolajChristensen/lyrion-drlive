# DRLive custom content type.
# Fields: <type> <suffixes> <mimetypes> <slimtype>
# The "drlive:" suffix lets Slim::Music::Info map a drlive:// URL to this type,
# and the "audio" slimtype makes it a playable song (not a playlist).
drlive	drlive:	audio/x-drlive	audio

# drvod:// (on-demand shows, e.g. TVA's latest episode) gets its OWN type,
# separate from "drlive" above: on-demand content is genuinely seekable (DR
# ships it as a finite file, not a rolling live buffer), and its
# custom-convert.conf profiles declare the "T" capability accordingly. That
# must never leak onto the live channels - a live stream has no fixed position
# to seek within, and offering a scrubber on one would be actively misleading.
drvod	drvod:	audio/x-drvod	audio
