# DRLive transcode rules.
#
# The protocol handler resolves drlive:// to an HLS variant playlist and puts it
# in $song->streamUrl(); LMS substitutes that into $URL$ below.
#
# Capability "R" (remote URL) is declared on purpose and is the ONLY capability:
# it stops LMS from opening its own input socket, so ffmpeg fetches the HLS
# playlist itself (which it must - a single socket cannot carry HLS segments).
#
# The capability line and the command line must directly follow the profile
# line with no blank lines between them.

drlive flc * *
	# R
	[ffmpeg] -loglevel quiet -nostdin -i $URL$ -vn -c:a flac -compression_level 0 -f flac -

drlive pcm * *
	# R
	[ffmpeg] -loglevel quiet -nostdin -i $URL$ -vn -c:a pcm_s16le -ar 48000 -ac 2 -f s16le -

drlive mp3 * *
	# R
	[ffmpeg] -loglevel quiet -nostdin -i $URL$ -vn -c:a libmp3lame -b:a 192k -f mp3 -
