# DRLive transcode rules.
#
# The protocol handler resolves drlive:// to an HLS variant playlist and puts it
# in $song->streamUrl(); LMS substitutes that into $URL$ below.
#
# Capability "R" (remote URL) is declared on purpose and is the ONLY capability:
# it stops LMS from opening its own input socket, so ffmpeg fetches the HLS
# playlist itself (which it must - a single socket cannot carry HLS segments).
#
# The capability line and the command line must directly follow the profile
# line with no blank lines between them.
#
# -reconnect/-reconnect_streamed/-reconnect_delay_max let ffmpeg ride out a
# dropped segment fetch instead of exiting and stopping playback - these are
# 24/7 live streams. Only options present since ffmpeg 3.x are used, because an
# unrecognised option makes ffmpeg exit fatally on servers with an older build.
# -loglevel error (not quiet) so real failures reach server.log.

drlive flc * *
	# R
	[ffmpeg] -loglevel error -nostdin -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 -i $URL$ -vn -c:a flac -compression_level 0 -f flac -

drlive pcm * *
	# R
	[ffmpeg] -loglevel error -nostdin -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 -i $URL$ -vn -c:a pcm_s16le -ar 48000 -ac 2 -f s16le -

drlive mp3 * *
	# R
	[ffmpeg] -loglevel error -nostdin -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 -i $URL$ -vn -c:a libmp3lame -b:a 192k -f mp3 -

# drvod (on-demand shows, e.g. TVA) - same as drlive above. Deliberately just
# "R", no "T": seeking was attempted (v0.1.9-v0.1.11) and reverted after live
# testing found a bug in LMS's own core, not this config or ffmpeg - see the
# README's Troubleshooting section ("Seeking and pause/resume do not work")
# for the full investigation before re-attempting this.

drvod flc * *
	# R
	[ffmpeg] -loglevel error -nostdin -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 -i $URL$ -vn -c:a flac -compression_level 0 -f flac -

drvod pcm * *
	# R
	[ffmpeg] -loglevel error -nostdin -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 -i $URL$ -vn -c:a pcm_s16le -ar 48000 -ac 2 -f s16le -

drvod mp3 * *
	# R
	[ffmpeg] -loglevel error -nostdin -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 -i $URL$ -vn -c:a libmp3lame -b:a 192k -f mp3 -
