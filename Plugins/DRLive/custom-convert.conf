# DRLive transcode rules.
#
# The protocol handler resolves drlive:// to an HLS variant playlist and puts it
# in $song->streamUrl(); LMS substitutes that into $URL$ below.
#
# Capability "R" (remote URL) is declared on purpose and is the ONLY capability:
# it stops LMS from opening its own input socket, so ffmpeg fetches the HLS
# playlist itself (which it must - a single socket cannot carry HLS segments).
#
# The capability line and the command line must directly follow the profile
# line with no blank lines between them.
#
# -reconnect/-reconnect_streamed/-reconnect_delay_max let ffmpeg ride out a
# dropped segment fetch instead of exiting and stopping playback - these are
# 24/7 live streams. Only options present since ffmpeg 3.x are used, because an
# unrecognised option makes ffmpeg exit fatally on servers with an older build.
# -loglevel error (not quiet) so real failures reach server.log.

drlive flc * *
	# R
	[ffmpeg] -loglevel error -nostdin -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 -i $URL$ -vn -c:a flac -compression_level 0 -f flac -

drlive pcm * *
	# R
	[ffmpeg] -loglevel error -nostdin -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 -i $URL$ -vn -c:a pcm_s16le -ar 48000 -ac 2 -f s16le -

drlive mp3 * *
	# R
	[ffmpeg] -loglevel error -nostdin -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 -i $URL$ -vn -c:a libmp3lame -b:a 192k -f mp3 -

# drvod (on-demand shows, e.g. TVA) - same as drlive above, plus "T": DR ships
# this as a finite file, so a seek/pause-resume can ask ffmpeg to start
# decoding from a specific offset instead of position 0.
#
# T's START template must wrap the WHOLE "-ss <value>" pair, not just the
# value: %s alone substitutes to an empty string for an ordinary play (no seek
# requested), and "-ss " immediately followed by the next flag would make
# ffmpeg try to parse that flag as -ss's numeric argument and fail - breaking
# even non-seek playback. Wrapping the flag inside T:{START=...} means the
# WHOLE pair disappears together when $START$ is empty, exactly matching the
# pattern LMS's own stock convert.conf uses for this (e.g. flac/faad profiles
# with T:{START=--skip=%t} or T:{START=-j %s}).
#
# EXPERIMENTAL: this config syntax and VODProtocolHandler::getSeekData's
# return shape are both built from tracing LMS's own source, not verified
# against a running server. If seeking misbehaves, ordinary playback (no seek
# attempted) is unaffected, since $START$ is empty either way until a seek is
# actually requested.

drvod flc * *
	# R T:{START=-ss %s}
	[ffmpeg] -loglevel error -nostdin $START$ -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 -i $URL$ -vn -c:a flac -compression_level 0 -f flac -

drvod pcm * *
	# R T:{START=-ss %s}
	[ffmpeg] -loglevel error -nostdin $START$ -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 -i $URL$ -vn -c:a pcm_s16le -ar 48000 -ac 2 -f s16le -

drvod mp3 * *
	# R T:{START=-ss %s}
	[ffmpeg] -loglevel error -nostdin $START$ -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 -i $URL$ -vn -c:a libmp3lame -b:a 192k -f mp3 -
